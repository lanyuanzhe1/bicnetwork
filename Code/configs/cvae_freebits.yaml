# cVAE 变体：free-bits 防后验坍塌实验

data:
  npz_path: data/processed/data.npz

model:
  param_dim: 6
  spec_dim: 1101
  latent_dim: 16

train:
  seed: 42
  batch_size: 32
  max_epochs: 500
  lr: 0.001
  weight_decay: 0.0001
  patience: 50
  beta_max: 0.05            # 降低 KL 权重
  beta_warmup_epochs: 30
  free_bits: 0.1            # 每维至少 0.1 nats（总 KL 下限 1.6），保持编码器活性

output:
  runs_dir: runs
