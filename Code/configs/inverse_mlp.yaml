# 逆向网络基线 2/4：残差 MLP（对标 ForwardMLP 的反向）
# 整条 1101 点光谱 → 6 个归一化参数

data:
  npz_path: data/processed/data.npz

model:
  name: mlp
  in_dim: 1101
  out_dim: 6
  width: 512
  n_blocks: 3

train:
  seed: 42
  batch_size: 32
  max_epochs: 250
  lr: 0.00005
  weight_decay: 0.0001
  patience: 50

output:
  runs_dir: runs
