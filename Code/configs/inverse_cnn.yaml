# 逆向网络基线 4/4：1D-CNN（显式建模谱的局部结构）
# 整条 1101 点光谱 → 6 个归一化参数

data:
  npz_path: data/processed/data.npz

model:
  name: cnn
  in_dim: 1101
  out_dim: 6
  channels: [32, 64, 128]
  kernel: 7
  pool: 2
  fc: 256
  dropout: 0.1

train:
  seed: 42
  batch_size: 32
  max_epochs: 500
  lr: 0.001
  weight_decay: 0.0001
  patience: 50

output:
  runs_dir: runs
