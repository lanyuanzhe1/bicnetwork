# cVAE 逆向网络训练配置（谱 → 参数）

data:
  npz_path: data/processed/data.npz   # 相对 Code/ 目录

model:
  param_dim: 6
  spec_dim: 1101
  latent_dim: 16

train:
  seed: 42
  batch_size: 32
  max_epochs: 500
  lr: 0.001
  weight_decay: 0.0001
  patience: 50              # early stopping（验证集总损失）
  beta_max: 0.1             # KL 权重上限
  beta_warmup_epochs: 30    # β 从 0 线性升到 beta_max 的 epoch 数

output:
  runs_dir: runs
